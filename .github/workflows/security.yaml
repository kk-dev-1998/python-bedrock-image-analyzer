name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # New CVEs are published without any code change, so also scan on a schedule.
    # Mondays 00:00 UTC = 09:00 JST.
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Dependency vulnerabilities (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      # requirements.txt pins every package (including transitive ones), so there is
      # no need to resolve or install anything; pip-audit only checks the pinned versions.
      - name: Audit pinned dependencies
        run: pip-audit -r requirements.txt --no-deps --disable-pip